<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>냉장고를 부탁해 - AI 식재료 분석 & 레시피</title>
    <style>
      :root {
        --primary-color: #4a90e2;
        --secondary-color: #f39c12;
        --bg-color: #f4f7f6;
        --card-bg: #ffffff;
        --text-color: #333;
      }

      body {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        max-width: 800px;
        width: 100%;
        background: var(--card-bg);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      /* 헤더 스타일 */
      .main-header {
        width: 100%;
        max-width: 800px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 0;
        margin-bottom: 20px;
        border-bottom: 1px solid #ddd;
      }

      .logo {
        font-size: 20px;
        font-weight: bold;
        color: var(--primary-color);
      }

      .auth-nav {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .auth-nav button {
        padding: 8px 15px;
        font-size: 14px;
        background: transparent;
        color: var(--text-color);
        border: 1px solid #ccc;
        border-radius: 5px;
        cursor: pointer;
      }

      .auth-nav button:hover {
        background: #eee;
      }

      #logout-btn {
        border-color: #e74c3c;
        color: #e74c3c;
      }

      #logout-btn:hover {
        background: #fdf2f2;
      }

      #drop-zone {
        width: 100%;
        min-height: 200px;
        height: auto;
        border: 2px dashed #ccc;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: border-color 0.3s;
        margin-bottom: 20px;
        padding: 10px;
        box-sizing: border-box;
      }

      #drop-zone:hover {
        border-color: var(--primary-color);
      }

      #drop-zone p {
        margin: 0;
        text-align: center;
      }

      #image-preview {
        max-width: 100%;
        max-height: 400px;
        border-radius: 10px;
        display: none;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }

      button {
        padding: 12px 25px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.3s;
      }

      #analyze-btn {
        background-color: var(--primary-color);
        color: white;
      }

      #analyze-btn:disabled {
        background-color: #ccc;
      }

      #find-recipes-btn {
        background-color: var(--secondary-color);
        color: white;
        display: none;
      }

      .result-section {
        margin-top: 30px;
      }

      .ingredient-tag {
        display: inline-block;
        background: #e1f5fe;
        color: #0288d1;
        padding: 5px 12px;
        border-radius: 20px;
        margin: 5px;
        font-size: 14px;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 20px;
      }

      /* 섹션 헤더 */
      .section-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
      }

      .section-header button {
        background: #eee;
        padding: 5px 12px;
        font-size: 14px;
      }

      /* 폼 스타일 */
      .form-group {
        margin-bottom: 15px;
        width: 100%;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-group input, .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .primary-btn {
        width: 100%;
        background: var(--primary-color);
        color: white;
      }

      /* 레시피 그리드 스타일 */
      .recipe-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .recipe-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        transition: transform 0.3s;
        cursor: pointer;
        border: 1px solid #eee;
      }

      .recipe-card:hover {
        transform: translateY(-5px);
      }

      .recipe-info {
        padding: 15px;
      }

      .recipe-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        color: var(--primary-color);
      }

      .recipe-meta {
        font-size: 12px;
        color: #777;
        margin-bottom: 10px;
      }

      .recipe-summary {
        font-size: 14px;
        line-height: 1.4;
        color: #555;
      }

      /* 모달 스타일 */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        overflow-y: auto;
      }

      .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 30px;
        width: 80%;
        max-width: 600px;
        border-radius: 15px;
        position: relative;
      }

      .auth-modal-content {
        max-width: 400px;
      }

      .close-modal {
        position: absolute;
        right: 20px;
        top: 20px;
        font-size: 24px;
        cursor: pointer;
      }

      .auth-switch {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
      }

      .profile-card {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #eee;
      }

      .step-item {
        margin-bottom: 10px;
        padding-left: 25px;
        position: relative;
      }

      .step-number {
        position: absolute;
        left: 0;
        font-weight: bold;
        color: var(--primary-color);
      }

      /* 저장/삭제 버튼 */
      .save-recipe-btn {
        margin-top: 15px;
        background: var(--secondary-color);
        color: white;
        padding: 12px;
        width: 100%;
      }

      .delete-recipe-btn {
        margin-top: 10px;
        background: #e74c3c;
        color: white;
        padding: 8px 15px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <div class="logo">🍳 냉장고를 부탁해 AI</div>
      <div id="auth-nav" class="auth-nav">
        <button id="login-nav-btn">로그인</button>
        <button id="signup-nav-btn">회원가입</button>
      </div>
      <div id="user-nav" class="auth-nav" style="display: none">
        <span id="welcome-msg"></span>
        <button id="my-recipes-nav-btn">나의 레시피</button>
        <button id="profile-nav-btn">설정</button>
        <button id="logout-btn">로그아웃</button>
      </div>
    </header>

    <div class="container">
      <section id="main-section">
        <div id="drop-zone">
          <p>냉장고 사진을 이곳에 드래그하거나 클릭하여 업로드하세요</p>
          <input
            type="file"
            id="file-input"
            accept="image/*"
            style="display: none"
          />
          <img id="image-preview" alt="미리보기" />
        </div>

        <div class="btn-group">
          <button id="analyze-btn" disabled>식재료 분석하기</button>
          <button id="find-recipes-btn">레시피 추천받기 ✨</button>
        </div>

        <div id="loading-spinner" class="loading">
          <p>분석 중입니다... 잠시만 기다려주세요.</p>
        </div>

        <div class="result-section">
          <h3 id="ingredient-title" style="display: none">발견된 식재료</h3>
          <div id="ingredient-list"></div>
        </div>

        <div id="recipe-container" class="recipe-grid"></div>
      </section>

      <!-- 나의 레시피 섹션 -->
      <section id="my-recipes-section" style="display: none">
        <div class="section-header">
          <button id="back-to-main-btn">← 돌아가기</button>
          <h2>나의 저장된 레시피</h2>
        </div>
        <div id="saved-recipes-container" class="recipe-grid"></div>
      </section>

      <!-- 프로필/설정 섹션 -->
      <section id="profile-section" style="display: none">
        <div class="section-header">
          <button id="back-to-main-from-profile-btn">← 돌아가기</button>
          <h2>사용자 설정</h2>
        </div>
        <div class="profile-card">
          <div class="form-group">
            <label for="dietary-preference">식단 선호도 (AI 추천에 반영됨)</label>
            <select id="dietary-preference">
              <option value="None">선택 안함</option>
              <option value="Vegetarian">채식주의 (Vegetarian)</option>
              <option value="Vegan">비건 (Vegan)</option>
              <option value="Gluten-Free">글루텐 프리 (Gluten-Free)</option>
              <option value="Keto">키토제닉 (Keto)</option>
            </select>
          </div>
          <button id="save-preferences-btn">설정 저장</button>
        </div>
      </section>
    </div>

    <!-- 인증 모달 (로그인/회원가입) -->
    <div id="auth-modal" class="modal">
      <div class="modal-content auth-modal-content">
        <span class="close-modal" id="close-auth-modal">&times;</span>
        <div id="login-form-container">
          <h2>로그인</h2>
          <div class="form-group">
            <input type="email" id="login-email" placeholder="이메일" />
          </div>
          <div class="form-group">
            <input type="password" id="login-password" placeholder="비밀번호" />
          </div>
          <button id="login-submit-btn" class="primary-btn">로그인</button>
          <p class="auth-switch">계정이 없으신가요? <a href="#" id="go-to-signup">회원가입</a></p>
        </div>
        <div id="signup-form-container" style="display: none">
          <h2>회원가입</h2>
          <div class="form-group">
            <input type="text" id="signup-username" placeholder="사용자명" />
          </div>
          <div class="form-group">
            <input type="email" id="signup-email" placeholder="이메일" />
          </div>
          <div class="form-group">
            <input type="password" id="signup-password" placeholder="비밀번호" />
          </div>
          <button id="signup-submit-btn" class="primary-btn">가입하기</button>
          <p class="auth-switch">이미 계정이 있으신가요? <a href="#" id="go-to-login">로그인</a></p>
        </div>
      </div>
    </div>

    <!-- 레시피 상세 모달 -->
    <div id="recipe-modal" class="modal">
      <div class="modal-content">
        <span class="close-modal" id="close-recipe-modal">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-meta"></p>
        <hr />
        <h3>조리 순서</h3>
        <div id="modal-steps"></div>
        <button id="save-current-recipe-btn" class="save-recipe-btn" style="display: none">이 레시피 저장하기 ⭐</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
